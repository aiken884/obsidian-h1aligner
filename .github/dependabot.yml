version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # obsidian typings are bumped deliberately, not by Dependabot (they may run
    # ahead of manifest.json's minAppVersion) — see RELEASING.md's pre-release cadence.
    ignore:
      - dependency-name: obsidian

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
